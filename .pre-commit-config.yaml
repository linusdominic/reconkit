# Install once with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: unit-tests
        name: unit tests (no database needed)
        entry: uv run pytest tests/unit -q -x
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
