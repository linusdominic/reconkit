name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reconkit
          POSTGRES_PASSWORD: reconkit
          POSTGRES_DB: reconkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reconkit -d reconkit"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      RECONKIT_TEST_PG_URL: postgresql://reconkit:reconkit@localhost:5432/reconkit
      RECONKIT_REQUIRE_PG: "1"   # a missing database is a failure in CI, not a skip
      # fakesnow (the in-process Snowflake emulator) needs Python 3.11+; skipped on 3.10.
      RECONKIT_REQUIRE_SNOWFLAKE: ${{ matrix.python-version != '3.10' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run pytest --cov --cov-report=term --cov-report=xml --junitxml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            pytest.xml
            coverage.xml

  emulators:
    # BigQuery and Redshift adapters against local emulators (docker-compose.yml, profile
    # "emulators"), with the compose Postgres as the other side. No cloud account.
    runs-on: ubuntu-latest
    env:
      RECONKIT_REQUIRE_PG: "1"
      RECONKIT_REQUIRE_BIGQUERY: "1"
      RECONKIT_REQUIRE_REDSHIFT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: docker compose up -d --wait postgres
      - run: docker compose --profile emulators up -d bigquery floci
      - run: uv sync --python 3.12
      - name: Wait for the emulators
        run: |
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:59050/bigquery/v2/projects/reconkit-test/datasets >/dev/null && break
            sleep 2
          done
          for _ in $(seq 60); do
            curl -s -o /dev/null http://127.0.0.1:45670/ && break
            sleep 2
          done
      - run: uv run pytest tests/integration -m "bigquery or redshift" --junitxml=pytest-emulators.xml
      - name: Emulator logs
        if: failure()
        run: docker compose --profile emulators logs --no-color bigquery floci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-emulators
          path: pytest-emulators.xml
      - name: Stop the emulators and the clusters Floci started
        if: always()
        run: |
          docker compose --profile emulators down -v
          docker ps -aq --filter name=floci-aws-redshift | xargs -r docker rm -f

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Install the wheel into a clean environment and run it
        run: |
          uv venv /tmp/smoke --python 3.12
          uv pip install --python /tmp/smoke/bin/python "$(ls dist/*.whl)[duckdb]"
          /tmp/smoke/bin/reconkit --version
          /tmp/smoke/bin/reconkit data-diff --version
          /tmp/smoke/bin/python -c "import reconkit.integrations.airflow, reconkit.integrations.dagster"
