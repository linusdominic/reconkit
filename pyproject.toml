[project]
name = "reconkit"
version = "0.2.0"
description = "Reconcile tables across databases by checksum bisection, and enforce data contracts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Linus Dominic Nathaniel" }]
keywords = ["data-engineering", "reconciliation", "data-diff", "data-contracts", "data-quality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
duckdb = ["duckdb>=1.0"]
snowflake = ["snowflake-connector-python>=3.0"]
bigquery = ["google-cloud-bigquery>=3.0"]
redshift = ["redshift-connector>=2.0"]
airflow = ["apache-airflow>=2.7"]
dagster = ["dagster>=1.6"]

[project.scripts]
reconkit = "reconkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconkit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "benchmarks", "README.md", "LICENSE", "CHANGELOG.md", "docker-compose.yml"]

[dependency-groups]
dev = [
    "duckdb>=1.0",
    "psycopg[binary]>=3.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "sqlglot>=25.0",
    "types-pyyaml",
    "pre-commit>=3.7",
    # Emulator-backed integration tests (tests/integration, docs/adapters.md). fakesnow
    # patches snowflake.connector in-process; it needs Python 3.11+.
    "fakesnow==0.12.1; python_version >= '3.11'",
    # fakesnow 0.12.1 imports snowflake.connector.converter, removed in connector 5.x
    # (tekumara/fakesnow#450).
    "snowflake-connector-python>=3.0,<5",
    "google-cloud-bigquery>=3.0",
    "redshift-connector>=2.0",
    "boto3>=1.34",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "S"]
ignore = [
    "S608",  # SQL is built from quoted identifiers and validated config; see docs/adr/0003
    "S101",  # asserts are fine in tests and for internal invariants
]

[tool.ruff.lint.per-file-ignores]
# Tests hold wide data tables and SQL literals; compound asserts read better there.
"tests/**" = ["S", "B011", "E501", "E741", "PT018", "PT012"]
"benchmarks/**" = ["S"]
"examples/**" = ["S"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/reconkit"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "snowflake.*", "google.*", "redshift_connector.*", "airflow.*", "dagster.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs the Postgres container from docker-compose.yml (RECONKIT_TEST_PG_URL)",
]
addopts = "-ra"

[tool.coverage.run]
source = ["reconkit"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
